openapi: 3.1.0
info:
  title: Colli Books API
  description: '

    API do projeto **Colli Books**

    '
  version: 0.1.0
paths:
  /:
    get:
      tags:
      - Root
      summary: Hello World
      description: Retorna uma mensagem estática para confirmar que a API está no
        ar.
      operationId: hello_world__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: Executa um `SELECT 1` no PostgreSQL. Responde **200** quando o
        banco está acessível e **503** quando não está.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: O banco de dados não está acessível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Autentica com e-mail e senha. Qualquer falha (e-mail inexistente,
        senha errada, convite pendente, conta inativa) responde `401 INVALID_CREDENTIALS`.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`INVALID_CREDENTIALS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Renovar sessão
      description: 'Troca o refresh token por um par novo. O token enviado deixa de
        valer. Reusar um token já trocado encerra todas as sessões do usuário. Qualquer
        falha responde `401 TOKEN_INVALID`: o app deve voltar ao login.'
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Revoga o refresh token informado. Sempre responde `204`, mesmo
        se já revogado.
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Usuário logado
      description: Dados do usuário dono do access token. O app usa `role` para exibir
        a área admin.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` (token ausente ou conta inativa) ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Esqueci minha senha
      description: Envia o link de redefinição para o e-mail, se houver conta ativa.
        Sempre responde `202` com a mesma mensagem, para não revelar se o e-mail está
        cadastrado.
      operationId: forgot_password_api_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Auth
      summary: Redefinir senha
      description: 'Troca a senha usando o token do link. O token vale uma vez só
        e todas as sessões abertas são encerradas. Token inválido, usado ou expirado:
        `400 RESET_TOKEN_INVALID`; senha fraca: `422 WEAK_PASSWORD`.'
      operationId: reset_password_api_v1_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: '`VALIDATION_ERROR` ou `WEAK_PASSWORD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: '`RESET_TOKEN_INVALID` (token inválido, já usado ou expirado).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/invites/verify:
    post:
      tags:
      - Convites
      summary: Conferir convite
      description: Confere o convite sem consumi-lo e devolve o e-mail, para a tela
        de completar o cadastro.
      operationId: verify_api_v1_invites_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteVerifyResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`INVITE_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`INVITE_ALREADY_USED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: '`INVITE_EXPIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/invites/accept:
    post:
      tags:
      - Convites
      summary: Completar cadastro pelo convite
      description: Grava nome (obrigatório), escola (opcional) e senha (mín. 8 caracteres),
        ativa a conta e já devolve a sessão autenticada. Senha fraca responde `422
        WEAK_PASSWORD`; nome vazio, `422 VALIDATION_ERROR`.
      operationId: accept_api_v1_invites_accept_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAcceptRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: '`VALIDATION_ERROR` ou `WEAK_PASSWORD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`INVITE_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`INVITE_ALREADY_USED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: '`INVITE_EXPIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/invites/resend:
    post:
      tags:
      - Convites
      summary: Reenviar convite expirado
      description: Se o convite estiver expirado e não usado, gera um novo e o envia
        para o e-mail cadastrado. Sempre responde `202` com a mesma mensagem; o link
        novo nunca volta aqui.
      operationId: resend_api_v1_invites_resend_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`; aguardar o header `Retry-After` antes de tentar
            de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/teachers:
    post:
      tags:
      - Admin
      summary: Cadastrar professor
      description: Cria o professor com status `invite_pending` e manda o link de
        convite para o e-mail dele, onde ele completa o cadastro (nome, escola e senha).
        O link também volta na resposta, para a editora reenviar por outro canal.
        Enquanto o cadastro não for completado, o login fica bloqueado.
      operationId: create_teacher_api_v1_admin_teachers_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherInviteResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`EMAIL_ALREADY_REGISTERED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Admin
      summary: Listar professores
      description: Todos os professores, com filtro por `status` (`invite_pending`
        | `active` | `inactive`) e busca `q` por nome/e-mail. O filtro "todos/ativos/pendentes"
        da tela vira o parâmetro `status`; sem ele, a lista volta completa — a base
        é pequena e o app monta os filtros sobre ela.
      operationId: list_teachers_api_v1_admin_teachers_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/UserStatus'
          - type: 'null'
          title: Status
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Teachers Api V1 Admin Teachers Get
        '422':
          description: '`VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/teachers/{teacher_id}/invite:
    post:
      tags:
      - Admin
      summary: Gerar novo convite
      description: Invalida os convites pendentes do professor, gera um novo link
        e o manda por e-mail.
      operationId: reissue_invite_api_v1_admin_teachers__teacher_id__invite_post
      security:
      - HTTPBearer: []
      parameters:
      - name: teacher_id
        in: path
        required: true
        schema:
          type: integer
          title: Teacher Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherInviteResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND` (professor não existe).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ACCOUNT_ALREADY_ACTIVE` (cadastro já completado).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/overview:
    get:
      tags:
      - Admin
      summary: Visão geral do painel
      description: 'Contadores do painel do admin (US13) em uma única chamada: total
        de obras, total de professores e convites pendentes.'
      operationId: get_overview_api_v1_admin_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/themes:
    get:
      tags:
      - Temas
      summary: Listar temas
      description: Temas disponíveis, em ordem alfabética. Lista pequena, sem paginação.
      operationId: list_themes_api_v1_themes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ThemeResponse'
                type: array
                title: Response List Themes Api V1 Themes Get
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Temas
      summary: Criar tema
      description: 'Não é permitido cadastrar dois temas com o mesmo nome, mesmo mudando
        a caixa: duplicata responde `409` (`THEME_ALREADY_EXISTS`).'
      operationId: create_theme_api_v1_themes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeResponse'
        '422':
          description: '`VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`THEME_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/themes/{theme_id}:
    patch:
      tags:
      - Temas
      summary: Renomear tema
      description: 'PATCH parcial: campo ausente no corpo significa "não alterar".
        Renomear preserva os vínculos com as obras (US16).'
      operationId: update_theme_api_v1_themes__theme_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: theme_id
        in: path
        required: true
        schema:
          type: integer
          title: Theme Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeResponse'
        '422':
          description: '`VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`THEME_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/education-levels:
    get:
      tags:
      - Escolaridades
      summary: Listar escolaridades
      description: Escolaridades na ordem pedagógica (`sort_order`), desempatadas
        pelo nome. Lista pequena, sem paginação.
      operationId: list_education_levels_api_v1_education_levels_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EducationLevelResponse'
                type: array
                title: Response List Education Levels Api V1 Education Levels Get
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Escolaridades
      summary: Criar escolaridade
      description: 'Não é permitido cadastrar duas escolaridades com o mesmo nome,
        mesmo mudando a caixa: duplicata responde `409` (`EDUCATION_LEVEL_ALREADY_EXISTS`).'
      operationId: create_education_level_api_v1_education_levels_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationLevelCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationLevelResponse'
        '422':
          description: '`VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`EDUCATION_LEVEL_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/education-levels/{level_id}:
    patch:
      tags:
      - Escolaridades
      summary: Renomear escolaridade
      description: 'PATCH parcial: campo ausente no corpo significa "não alterar".
        Renomear preserva os vínculos com obras e professores (US16).'
      operationId: update_education_level_api_v1_education_levels__level_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: level_id
        in: path
        required: true
        schema:
          type: integer
          title: Level Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationLevelUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationLevelResponse'
        '422':
          description: '`VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`EDUCATION_LEVEL_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/books:
    get:
      tags:
      - Obras
      summary: Buscar obras
      description: 'Catálogo completo com busca por título/autor (`q`, ignorando acentos
        e caixa — US07) e filtros por tema e escolaridade (US08). A lista volta integralmente
        — sem paginação — e cada item já traz `is_saved`, o flag da Minha Seleção
        do usuário logado. `sort` aceita `relevance` (padrão: obras dos temas/escolaridades
        do professor primeiro, US11), `title` e `year`.'
      operationId: list_books_api_v1_books_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Q
      - name: theme_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Theme Id
      - name: education_level_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Education Level Id
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - relevance
          - title
          - year
          type: string
          default: relevance
          title: Sort
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
                title: Response List Books Api V1 Books Get
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Obras
      summary: Cadastrar obra
      description: 'Cria a obra (US15/US17). O corpo é `multipart/form-data`: campos
        de texto, `theme_ids` repetido (`theme_ids=6&theme_ids=8`) e a capa opcional
        no campo `cover` (PNG/JPEG, até 5 MB — `422 IMAGE_INVALID` ou `IMAGE_TOO_LARGE`).
        ISBN duplicado responde `409 ISBN_ALREADY_REGISTERED`; ids de tema/escolaridade
        inexistentes, `422` com o campo apontado em `details`.'
      operationId: create_book_api_v1_books_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookCreateForm'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '422':
          description: '`VALIDATION_ERROR`, `IMAGE_INVALID` ou `IMAGE_TOO_LARGE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ISBN_ALREADY_REGISTERED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/books/{book_id}:
    get:
      tags:
      - Obras
      summary: Detalhe da obra
      description: Todos os dados da tela de detalhe (US09), incluindo os links externos
        (`store_url`, `book_url`, `pedagogical_material_url`) e `is_saved`.
      operationId: get_book_api_v1_books__book_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Obras
      summary: Editar obra
      description: 'Edição parcial (US15/US17), também em `multipart/form-data`. Regras
        do PATCH multipart: campo **ausente** = não alterar; campo de texto ou numérico
        enviado **vazio** (`campo=`) = limpar; `theme_ids=` (vazio) remove todos os
        temas; `cover` ausente mantém a capa, arquivo novo a substitui. As alterações
        refletem imediatamente na busca.'
      operationId: update_book_api_v1_books__book_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookUpdateForm'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '422':
          description: '`VALIDATION_ERROR`, `IMAGE_INVALID` ou `IMAGE_TOO_LARGE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (exige papel `admin`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ISBN_ALREADY_REGISTERED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me:
    patch:
      tags:
      - Perfil
      summary: Editar perfil
      description: 'Atualiza `full_name` e `school` (US10). PATCH parcial: campo ausente
        não altera; `school` vazia limpa o valor. O e-mail é a identidade da conta
        e não pode ser alterado por aqui.'
      operationId: update_profile_api_v1_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: '`VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/me/password:
    put:
      tags:
      - Perfil
      summary: Trocar senha
      description: Troca a senha exigindo a senha atual. `400 CURRENT_PASSWORD_INVALID`
        se a senha atual não confere; `422 WEAK_PASSWORD` se a nova não atende às
        regras. Em caso de sucesso, **todas as sessões são encerradas** — o access
        token atual segue válido até expirar, mas o próximo refresh leva o app de
        volta ao login.
      operationId: change_password_api_v1_me_password_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: '`VALIDATION_ERROR` ou `WEAK_PASSWORD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: '`CURRENT_PASSWORD_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/me/interests:
    put:
      tags:
      - Perfil
      summary: Definir temas e escolaridades lecionadas
      description: 'Substituição integral dos vínculos do professor (US11): o corpo
        é o conjunto completo — `[]` limpa. Esses vínculos alimentam a ordenação por
        relevância da busca (`GET /books`). Ids inexistentes respondem `422` com a
        lista em `details`.'
      operationId: update_interests_api_v1_me_interests_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestsUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestsResponse'
        '422':
          description: '`VALIDATION_ERROR` (ids inexistentes em `details`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/me/saved-books:
    get:
      tags:
