          type: string
          title: Message
          examples:
          - Acesso restrito a administradores.
        details:
          title: Details
          description: Informação extra; em 422, a lista de campos inválidos.
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Formato de todas as respostas de erro (ver `app/errors.py`).
    ForgotPasswordRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          examples:
          - professor@escola.com
      type: object
      required:
      - email
      title: ForgotPasswordRequest
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: '`ok` ou `error`.'
          examples:
          - ok
        database:
          type: string
          title: Database
          description: '`connected` quando o banco responde; caso contrário, o erro.'
          examples:
          - connected
      type: object
      required:
      - status
      - database
      title: HealthResponse
    HelloResponse:
      properties:
        message:
          type: string
          title: Message
          examples:
          - Hello World
      type: object
      required:
      - message
      title: HelloResponse
    InterestsResponse:
      properties:
        themes:
          items:
            $ref: '#/components/schemas/ThemeSummary'
          type: array
          title: Themes
        education_levels:
          items:
            $ref: '#/components/schemas/EducationLevelSummary'
          type: array
          title: Education Levels
      type: object
      required:
      - themes
      - education_levels
      title: InterestsResponse
    InterestsUpdateRequest:
      properties:
        theme_ids:
          items:
            type: integer
          type: array
          title: Theme Ids
          examples:
          - - 6
            - 8
        education_level_ids:
          items:
            type: integer
          type: array
          title: Education Level Ids
          examples:
          - - 2
      type: object
      title: InterestsUpdateRequest
      description: 'Temas e escolaridades que o professor leciona (US11).


        Substituição integral e idempotente: o que está no corpo passa a ser o

        conjunto completo — `[]` limpa os vínculos daquele tipo.'
    InviteAcceptRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
          description: Token do link ou código colado no app.
        full_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Full Name
          examples:
          - Maria Souza
        school:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: School
          description: Opcional; pode ser preenchida depois.
          examples:
          - E.E. Machado de Assis
        password:
          type: string
          title: Password
          examples:
          - senha-segura-123
      type: object
      required:
      - token
      - full_name
      - password
      title: InviteAcceptRequest
      description: 'Dados que faltam no cadastro: a editora só informou o e-mail.'
    InviteTokenRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
          description: Token do link ou código colado no app.
      type: object
      required:
      - token
      title: InviteTokenRequest
    InviteVerifyResponse:
      properties:
        email:
          type: string
          title: Email
          examples:
          - professor@escola.com
      type: object
      required:
      - email
      title: InviteVerifyResponse
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          examples:
          - professor@escola.com
        password:
          type: string
          minLength: 1
          title: Password
          examples:
          - senha-segura-123
      type: object
      required:
      - email
      - password
      title: LoginRequest
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    PasswordChangeRequest:
      properties:
        current_password:
          type: string
          minLength: 1
          title: Current Password
        new_password:
          type: string
          title: New Password
          examples:
          - nova-senha-segura
      type: object
      required:
      - current_password
      - new_password
      title: PasswordChangeRequest
      description: 'Troca de senha autenticada: exige a senha atual para que um aparelho

        desatento não sirva para trocar a senha.'
    ProfileUpdateRequest:
      properties:
        full_name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Full Name
          examples:
          - Maria Souza
        school:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: School
          examples:
          - E.E. Machado de Assis
      type: object
      title: ProfileUpdateRequest
      description: 'PATCH parcial: campo ausente = não alterar; `school` vazia vira
        `null`.


        O e-mail não aparece aqui de propósito: é a identidade da conta (US10 o

        marca como somente leitura).'
    RefreshTokenRequest:
      properties:
        refresh_token:
          type: string
          minLength: 1
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshTokenRequest
    ResetPasswordRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
          description: Token do link ou código colado no app.
        new_password:
          type: string
          title: New Password
          examples:
          - minha-senha-nova
      type: object
      required:
      - token
      - new_password
      title: ResetPasswordRequest
    TeacherCreateRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          examples:
          - professor@escola.com
      type: object
      required:
      - email
      title: TeacherCreateRequest
    TeacherInviteResponse:
      properties:
        id:
          type: integer
          title: Id
          examples:
          - 42
        email:
          type: string
          title: Email
          examples:
          - professor@escola.com
        status:
          $ref: '#/components/schemas/UserStatus'
          examples:
          - invite_pending
        invite_link:
          type: string
          title: Invite Link
          examples:
          - collibooks://convite?token=...
        invite_code:
          type: string
          title: Invite Code
          examples:
          - b7f2c1d4e9a3...
        invite_expires_at:
          type: string
          format: date-time
          title: Invite Expires At
          examples:
          - '2026-10-30T12:00:00Z'
      type: object
      required:
      - id
      - email
      - status
      - invite_link
      - invite_code
      - invite_expires_at
      title: TeacherInviteResponse
      description: 'Professor com o convite recém-gerado.


        O convite já foi enviado para o e-mail do professor. O link também volta aqui

        para a editora reenviar por outro canal (WhatsApp) se o e-mail não chegar.

        Como nem todo app deixa clicável um link `collibooks://`, o `invite_code`

        (o mesmo token) pode ser colado na tela "Tenho um convite".'
    ThemeCreateRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
          examples:
          - Empatia
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          examples:
          - Obras que trabalham empatia e respeito
      type: object
      required:
      - name
      title: ThemeCreateRequest
    ThemeResponse:
      properties:
        id:
          type: integer
          title: Id
          examples:
          - 6
        name:
          type: string
          title: Name
          examples:
          - Inclusão
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          examples:
          - Obras sobre inclusão e acessibilidade
      type: object
      required:
      - id
      - name
      title: ThemeResponse
    ThemeSummary:
      properties:
        id:
          type: integer
          title: Id
          examples:
          - 6
        name:
          type: string
          title: Name
          examples:
          - Inclusão
      type: object
      required:
      - id
      - name
      title: ThemeSummary
      description: Tema no formato mínimo, reutilizado nas respostas de obras e perfil.
    ThemeUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
          examples:
          - Empatia
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          examples:
          - Obras que trabalham empatia
      type: object
      title: ThemeUpdateRequest
      description: 'PATCH parcial: campo ausente ou vazio = não alterar (não há "limpar"
        campo a campo).'
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: 'JWT curto, enviado em `Authorization: Bearer`.'
        refresh_token:
          type: string
          title: Refresh Token
          description: Token opaco e longo. Guardar no armazenamento seguro do aparelho
            e usar em `/auth/refresh`. Cada uso devolve um novo; o anterior deixa
            de valer.
        token_type:
          type: string
          title: Token Type
          default: bearer
          examples:
          - bearer
        expires_in:
          type: integer
          title: Expires In
          description: Validade do access token, em segundos.
          examples:
          - 900
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      - user
      title: TokenResponse
    UserResponse:
      properties:
        id:
          type: integer
          title: Id
          examples:
          - 1
        email:
          type: string
          title: Email
          examples:
          - professor@escola.com
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
          examples:
          - Maria Souza
        school:
          anyOf:
          - type: string
          - type: 'null'
          title: School
          examples:
          - E.E. Machado de Assis
        role:
          $ref: '#/components/schemas/UserRole'
          examples:
          - teacher
        status:
          $ref: '#/components/schemas/UserStatus'
          examples:
          - active
      type: object
      required:
      - id
      - email
      - role
      - status
      title: UserResponse
      description: Dados do usuário logado. O app usa `role` para mostrar (ou não)
        a área administrativa.
    UserRole:
      type: string
      enum:
      - admin
      - teacher
      title: UserRole
      description: 'Perfis do sistema. Não há auto-cadastro: quem entra é criado pela
        editora.'
    UserStatus:
      type: string
      enum:
      - invite_pending
      - active
      - inactive
      title: UserStatus
      description: 'Estado da conta.


        `INVITE_PENDING` é o estado inicial da US01 — a conta existe, mas ainda não

        tem senha e por isso o login é bloqueado.'
  securitySchemes:
    HTTPBearer:
      type: http
      description: Access token obtido em `/api/v1/auth/login`.
      scheme: bearer
tags:
- name: Root
  description: Endpoint raiz da aplicação.
- name: Health
  description: Verificação de saúde da API e da conexão com o banco de dados.
- name: Auth
  description: Login, renovação de sessão, logout e dados do usuário logado.
- name: Convites
  description: Primeiro acesso do professor a partir do link de convite.
- name: Admin
  description: Rotas exclusivas da editora (papel `admin`).
- name: Obras
  description: 'Catálogo de obras: busca e detalhe para todos; cadastro e edição só
    da editora.'
- name: Temas
  description: 'Temas do acervo: listagem aberta a logados; criação e renomeação só
    da editora.'
- name: Escolaridades
  description: 'Escolaridades do acervo: listagem aberta a logados; criação e renomeação
    só da editora.'
- name: Perfil
  description: Dados do próprio usuário, temas/escolaridades que leciona e Minha Seleção.
