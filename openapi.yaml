      summary: Listar Minha Seleção
      description: Obras salvas pelo usuário, da mais recente à mais antiga, no mesmo
        formato dos itens de `GET /books`. Lista integral, sem paginação.
      operationId: list_saved_books_api_v1_me_saved_books_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BookSummary'
                type: array
                title: Response List Saved Books Api V1 Me Saved Books Get
        '422':
          description: '`VALIDATION_ERROR`; campos inválidos em `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED` ou `TOKEN_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/me/saved-books/{book_id}:
    put:
      tags:
      - Perfil
      summary: Salvar obra na seleção
      description: 'Salva a obra na Minha Seleção. Idempotente: salvar uma obra já
        salva também responde `204` (seguro repetir após falha de rede).'
      operationId: save_book_api_v1_me_saved_books__book_id__put
