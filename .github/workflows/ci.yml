name: CI

on:
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install ruff==0.9.10

      - name: Verificar formatação (ruff format)
        run: ruff format --check .

      - name: Verificar lint (ruff check)
        run: ruff check .

  tests:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint

    # Os testes de integração precisam de PostgreSQL real (unaccent, pg_trgm, GIN).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/colli_books_test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Executar testes com cobertura
        run: pytest --cov=app --cov-report=term-missing

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
